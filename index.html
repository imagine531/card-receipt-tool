<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>법인카드 영수증 정리 도구</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#1a2e4a;--teal:#0f7b7b;--teal-light:#e8f5f5;
  --g50:#f8fafc;--g100:#f1f5f9;--g200:#e2e8f0;--g400:#94a3b8;--g600:#475569;--g800:#1e293b;
  --green:#059669;--green-light:#d1fae5;--red:#dc2626;--red-light:#fee2e2;--orange:#d97706;--orange-light:#fef3c7;
}
body{font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;font-size:14px;color:var(--g800);background:var(--g50);min-height:100vh}
.header{background:var(--navy);color:white;padding:18px 32px;display:flex;align-items:center;gap:12px}
.header h1{font-size:17px;font-weight:600}
.header small{font-size:13px;color:#94a3b8}
.container{max-width:960px;margin:0 auto;padding:28px 20px}
.card{background:white;border:1px solid var(--g200);border-radius:10px;padding:20px 24px;margin-bottom:16px}
.card-title{font-size:13px;font-weight:600;color:var(--g600);text-transform:uppercase;letter-spacing:.04em;margin-bottom:14px;display:flex;align-items:center;gap:6px}
.step{background:var(--navy);color:white;width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0}
.upload-zone{border:1.5px dashed var(--g200);border-radius:8px;padding:22px 16px;text-align:center;cursor:pointer;transition:all .15s;position:relative;background:var(--g50)}
.upload-zone:hover,.upload-zone.drag-over{border-color:var(--teal);background:var(--teal-light)}
.upload-zone.done{border-color:var(--green);background:var(--green-light);border-style:solid}
.upload-zone input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.upload-icon{font-size:26px;margin-bottom:6px}
.upload-label{font-size:13px;font-weight:500;color:var(--g600)}
.upload-sub{font-size:12px;color:var(--g400);margin-top:3px}
.upload-done{font-size:12px;color:var(--green);font-weight:600;margin-top:4px}
.config-row{display:flex;gap:12px;margin-top:14px;align-items:flex-end;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:4px;flex:1;min-width:130px}
.field label{font-size:12px;color:var(--g600);font-weight:500}
.field input{border:1px solid var(--g200);border-radius:6px;padding:7px 10px;font-size:13px;font-family:inherit;background:white}
.field input:focus{outline:none;border-color:var(--teal)}
.btn{padding:9px 20px;border-radius:7px;border:none;cursor:pointer;font-size:13px;font-family:inherit;font-weight:600;transition:all .15s;display:inline-flex;align-items:center;gap:6px}
.btn-navy{background:var(--navy);color:white}
.btn-navy:hover{background:#142338}
.btn-lg{padding:12px 28px;font-size:14px}
table{width:100%;border-collapse:collapse;font-size:13px}
thead tr{background:var(--navy);color:white}
th{padding:10px 12px;text-align:left;font-weight:500;font-size:12px;white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--g100)}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--g50)}
.badge{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:20px;font-size:12px;font-weight:600}
.ok{background:var(--green-light);color:var(--green)}
.no{background:var(--red-light);color:var(--red)}
.merged{background:#ede9fe;color:#6d28d9}
.summary-bar{display:flex;gap:16px;padding:14px 0;flex-wrap:wrap}
.sitem{display:flex;align-items:center;gap:6px;font-size:13px}
.snum{font-size:20px;font-weight:700}
.snum.green{color:var(--green)}.snum.red{color:var(--red)}.snum.navy{color:var(--navy)}.snum.purple{color:#6d28d9}
.sdiv{width:1px;background:var(--g200);height:36px}
.action-bar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:16px}
.alert{padding:10px 14px;border-radius:7px;font-size:13px;margin-bottom:12px;display:flex;align-items:flex-start;gap:8px}
.alert-warn{background:var(--orange-light);color:#92400e;border:1px solid #fcd34d}
.alert-info{background:var(--teal-light);color:#065f46;border:1px solid #6ee7b7}
.progress-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;align-items:center;justify-content:center}
.progress-overlay.show{display:flex}
.progress-box{background:white;border-radius:12px;padding:32px 40px;text-align:center;min-width:280px}
.spinner{width:40px;height:40px;border:3px solid var(--g200);border-top-color:var(--teal);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
.progress-msg{font-size:14px;color:var(--g600);margin-bottom:6px}
.progress-sub{font-size:12px;color:var(--g400)}
.manual-upload-btn{font-size:11px;padding:3px 8px;border-radius:4px;border:1px solid var(--orange);color:var(--orange);background:white;cursor:pointer;white-space:nowrap}
.manual-upload-btn:hover{background:var(--orange-light)}
.manual-input{display:none}
</style>
</head>
<body>

<div class="header">
  <span>🧾</span>
  <h1>법인카드 영수증 정리 도구</h1>
  <small>커리어사업부</small>
</div>

<div class="container">
  <div class="card">
    <div class="card-title"><span class="step">1</span> 카드 사용 내역 엑셀 업로드</div>
    <div class="upload-zone" id="zone-excel">
      <input type="file" id="input-excel" accept=".xlsx,.xls,.csv">
      <div class="upload-icon">📊</div>
      <div class="upload-label">엑셀 파일을 여기에 드래그하거나 클릭해서 선택</div>
      <div class="upload-sub">.xlsx / .xls / .csv</div>
      <div class="upload-done" id="excel-done" style="display:none"></div>
    </div>
    <div class="config-row">
      <div class="field"><label>부서명</label><input type="text" id="dept" value="커리어사업부"></div>
      <div class="field"><label>카드번호 (뒤 3자리)</label><input type="text" id="card-no" placeholder="예: 813" maxlength="3"></div>
      <div class="field"><label>정산월</label><input type="month" id="settle-month"></div>
    </div>
  </div>

  <div class="card">
    <div class="card-title"><span class="step">2</span> 영수증 이미지 업로드</div>
    <div class="upload-zone" id="zone-img">
      <input type="file" id="input-imgs" accept="image/*,.pdf" multiple>
      <div class="upload-icon">📎</div>
      <div class="upload-label">영수증 파일을 여기에 드래그하거나 클릭해서 선택</div>
      <div class="upload-sub">JPG · PNG · PDF — 여러 파일 동시 가능 / PDF는 자동으로 이미지 변환</div>
      <div class="upload-done" id="imgs-done" style="display:none"></div>
    </div>
    <div class="alert alert-info" style="margin-top:12px;margin-bottom:0">
      💡 파일명에 <strong>적요 + 금액</strong> 포함 시 자동 매칭 정확도↑ — 예: <strong>중식_39,200원.jpg</strong>, <strong>야근택시비_29,000원.jpg</strong>
    </div>
  </div>

  <div class="card" id="result-card" style="display:none">
    <div class="action-bar">
      <div>
        <div class="card-title" style="margin-bottom:4px"><span class="step">3</span> 매칭 결과</div>
        <div class="summary-bar" id="summary-bar"></div>
      </div>
      <button class="btn btn-navy btn-lg" onclick="generateDocx()">⬇️ 증빙자료 내려받기 (.docx)</button>
    </div>
    <div id="warnings"></div>
    <div style="overflow-x:auto">
      <table>
        <thead><tr>
          <th>연번</th><th>승인일시</th><th>가맹점명</th><th>금액</th>
          <th>적요</th><th>영수증</th><th>파일명</th><th>수동추가</th>
        </tr></thead>
        <tbody id="result-body"></tbody>
      </table>
    </div>
  </div>
</div>

<div class="progress-overlay" id="progress-overlay">
  <div class="progress-box">
    <div class="spinner"></div>
    <div class="progress-msg" id="progress-msg">생성 중...</div>
    <div class="progress-sub" id="progress-sub"></div>
  </div>
</div>

<script>
// pdf.js worker
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

// ===== STATE =====
let excelRows = [];
let receiptFiles = {};  // name → File
let matchedRows = [];
let manualOverrides = {}; // rowIdx → File[]

// ===== KEYWORDS =====
const BRAND_MAP = {
  'notion':['노션'],'zoom':['줌'],'slack':['슬랙'],'google':['구글'],
  'microsoft':['마이크로소프트','ms'],'apple':['애플'],'aws':['아마존'],
  'figma':['피그마'],'dropbox':['드롭박스'],'adobe':['어도비'],
  'chatgpt':['챗지피티','openai'],'github':['깃헙','깃허브'],
  'canva':['캔바'],'miro':['미로'],
  'baemin':['우아한형제들','배달의민족','배민'],
  'coupangeats':['쿠팡이츠'],'yogiyo':['요기요'],
};
const MEAL_KEYWORDS = [
  {kw:'야근택시비', match:['야근택시비','야근택시']},
  {kw:'택시비',    match:['택시비','택시','taxi','카카오택시','카카오t']},
  {kw:'중식',      match:['중식']},
  {kw:'석식',      match:['석식']},
  {kw:'조식',      match:['조식']},
  {kw:'간식',      match:['간식']},
  {kw:'커피',      match:['커피','coffee']},
  {kw:'회식',      match:['회식']},
  {kw:'업무식사',  match:['업무식사']},
  {kw:'노션구독',  match:['노션','notion']},
  {kw:'줌구독',    match:['줌','zoom']},
  {kw:'슬랙구독',  match:['슬랙','slack']},
  {kw:'구글구독',  match:['구글','google']},
  {kw:'구독료',    match:['구독']},
];

function normName(s) {
  if (!s) return '';
  s = s.toLowerCase().replace(/[^\w가-힣]/g,'').replace(/주식회사|㈜|\(주\)|co\.|ltd\.|inc\./gi,'');
  for (const [en,koList] of Object.entries(BRAND_MAP)) {
    if (s.includes(en)) return en;
    for (const ko of koList) if (s.includes(ko)) return en;
  }
  return s;
}
function normAmt(s) {
  const n = parseInt(String(s||'').replace(/[^0-9]/g,''), 10);
  return isNaN(n) ? null : n;
}
function parseDateStr(s) {
  if (!s) return null;
  const c = String(s).replace(/[년월일\s]/g,'-').replace(/[\./]/g,'-').replace(/-+/g,'-').trim();
  const p = c.split('-').filter(Boolean);
  if (p.length >= 3) {
    let [y,m,d] = p;
    if (y.length===2) y='20'+y;
    return new Date(`${y}-${m.padStart(2,'0')}-${d.padStart(2,'0')}`);
  }
  return null;
}
function dateKey(s) {
  const d = parseDateStr(s);
  if (!d) return s;
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function fmtDate(s) {
  // 출력용: 2026.06.07. 형식
  const d = parseDateStr(s);
  if (!d) return s;
  return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}.`;
}
function extractMemo(filename) {
  const n = filename.replace(/\.[^.]+$/,'').toLowerCase();
  for (const {kw,match} of MEAL_KEYWORDS) {
    if (match.some(m => n.includes(m))) return kw;
  }
  const m = n.match(/[가-힣]+/);
  return m ? m[0] : '';
}
function isBaemin(merchant) {
  const n = normName(merchant);
  return n==='baemin'||merchant.includes('우아한형제')||merchant.includes('배달의민족')||merchant.includes('배민');
}
function fileAmtFromName(fn) {
  const nums = fn.replace(/,/g,'').match(/\d{4,}/g)||[];
  return nums.length ? normAmt(nums[nums.length-1]) : null;
}

// ===== EXCEL =====
document.getElementById('input-excel').addEventListener('change', function(e) {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const wb = XLSX.read(ev.target.result,{type:'array',cellDates:true});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const raw = XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
      parseExcel(raw);
      document.getElementById('excel-done').textContent=`✓ ${file.name} — ${excelRows.length}건`;
      document.getElementById('excel-done').style.display='block';
      document.getElementById('zone-excel').classList.add('done');
      tryMatch();
    } catch(err) { alert('엑셀 파일 오류: '+err.message); }
  };
  reader.readAsArrayBuffer(file);
});

function parseExcel(raw) {
  excelRows = [];
  let hIdx = -1;
  for (let i=0;i<Math.min(raw.length,10);i++) {
    if (['승인일','가맹점','금액','이용금액'].some(h=>raw[i].some(c=>String(c).includes(h)))) { hIdx=i; break; }
  }
  if (hIdx===-1) hIdx=0;
  const headers = raw[hIdx].map(c=>String(c).trim());
  const ci={date:-1,merchant:-1,amount:-1,memo:-1};
  headers.forEach((h,i)=>{
    const l=h.toLowerCase();
    if (ci.date===-1&&(l.includes('승인일')||l.includes('이용일')||l.includes('거래일'))) ci.date=i;
    if (ci.merchant===-1&&(l.includes('가맹점')||l.includes('상호')||l.includes('거래처')||l.includes('이용처'))) ci.merchant=i;
    if (ci.amount===-1&&(l.includes('이용금액')||l.includes('승인금액')||l.includes('사용금액')||l.includes('금액'))) ci.amount=i;
    if (ci.memo===-1&&(l.includes('적요')||l.includes('메모')||l.includes('비고'))) ci.memo=i;
  });
  if (ci.merchant===-1) ci.merchant=Math.min(1,headers.length-1);
  if (ci.amount===-1) ci.amount=Math.min(2,headers.length-1);
  if (ci.date===-1) ci.date=0;
  for (let i=hIdx+1;i<raw.length;i++) {
    const row=raw[i];
    if (!row||row.every(c=>String(c).trim()==='')) continue;
    const merchant=String(row[ci.merchant]||'').trim();
    const amtRaw=row[ci.amount];
    const amount=normAmt(amtRaw);
    if (!merchant&&!amount) continue;
    let dateStr='';
    const dv=row[ci.date];
    if (dv instanceof Date) dateStr=`${dv.getFullYear()}.${String(dv.getMonth()+1).padStart(2,'0')}.${String(dv.getDate()).padStart(2,'0')}.`;
    else dateStr=String(dv||'').trim();
    excelRows.push({
      date:dateStr, merchant, amount,
      amtDisplay:amount?amount.toLocaleString()+'원':String(amtRaw||''),
      memo:ci.memo>=0?String(row[ci.memo]||'').trim():'',
    });
  }
}

// ===== IMAGE UPLOAD =====
document.getElementById('input-imgs').addEventListener('change', function(e) {
  Array.from(e.target.files).forEach(f=>{ receiptFiles[f.name]=f; });
  document.getElementById('imgs-done').textContent=`✓ ${Object.keys(receiptFiles).length}개 파일`;
  document.getElementById('imgs-done').style.display='block';
  document.getElementById('zone-img').classList.add('done');
  tryMatch();
});

// ===== MATCHING =====
function tryMatch() {
  if (!excelRows.length) return;
  document.getElementById('result-card').style.display='block';

  const sorted = [...excelRows].sort((a,b)=>{
    const da=parseDateStr(a.date),db=parseDateStr(b.date);
    return (da&&db)?da-db:0;
  });

  const withFiles = sorted.map(row=>{
    const result={...row,files:[],matchType:null};
    const entries=Object.entries(receiptFiles);
    if (!entries.length) return result;
    const nm=normName(row.merchant);

    // Pass1: 이름+금액
    for (const [fn,f] of entries) {
      const fnm=normName(fn);
      const fa=fileAmtFromName(fn);
      if ((fnm.includes(nm)||nm.includes(fnm))&&row.amount&&fa===row.amount) {
        result.files=[f]; result.matchType='exact'; break;
      }
    }
    // Pass2: 이름만
    if (!result.files.length) {
      for (const [fn,f] of entries) {
        const fnm=normName(fn);
        if (fnm.includes(nm)||nm.includes(fnm)) { result.files=[f]; result.matchType='name'; break; }
      }
    }
    // Pass3: 금액만
    if (!result.files.length&&row.amount) {
      for (const [fn,f] of entries) {
        if (fileAmtFromName(fn)===row.amount) { result.files=[f]; result.matchType='amount'; break; }
      }
    }
    // 적요 추출
    if (result.files.length) {
      const m=extractMemo(result.files[0].name);
      if (m) result.memo=m;
    }
    if (!result.memo) {
      const m=extractMemo(result.merchant);
      if (m) result.memo=m;
    }
    return result;
  });

  // 배민 병합
  const merged=[];
  const used=new Set();
  const mealKws=['중식','석식','조식'];
  for (let i=0;i<withFiles.length;i++) {
    if (used.has(i)) continue;
    const row=withFiles[i];
    const rowMeal=mealKws.find(k=>row.memo.includes(k));
    if (isBaemin(row.merchant)&&rowMeal) {
      for (let j=i+1;j<withFiles.length;j++) {
        if (used.has(j)) continue;
        const r2=withFiles[j];
        if (isBaemin(r2.merchant)&&dateKey(r2.date)===dateKey(row.date)&&mealKws.find(k=>r2.memo.includes(k))===rowMeal) {
          merged.push({...row,amount:(row.amount||0)+(r2.amount||0),amtDisplay:((row.amount||0)+(r2.amount||0)).toLocaleString()+'원',files:[...row.files,...r2.files],merged:true});
          used.add(i); used.add(j); break;
        }
      }
    }
    if (!used.has(i)) { merged.push(row); used.add(i); }
  }

  matchedRows = merged.map((r,i)=>({...r,idx:i+1}));
  renderTable();
}

// ===== RENDER TABLE =====
function renderTable() {
  const total=matchedRows.length;
  const matched=matchedRows.filter(r=>(r.files&&r.files.length)||manualOverrides[r.idx]).length;
  const unmatched=total-matched;
  const mergedCount=matchedRows.filter(r=>r.merged).length;
  document.getElementById('summary-bar').innerHTML=`
    <div class="sitem"><span class="snum navy">${total}</span><span>전체</span></div>
    <div class="sdiv"></div>
    <div class="sitem"><span class="snum green">${matched}</span><span>매칭됨</span></div>
    <div class="sdiv"></div>
    <div class="sitem"><span class="snum red">${unmatched}</span><span>미매칭</span></div>
    ${mergedCount?`<div class="sdiv"></div><div class="sitem"><span class="snum purple">${mergedCount}</span><span>배민병합</span></div>`:''}
  `;
  let warns='';
  if (unmatched>0) warns+=`<div class="alert alert-warn">⚠️ ${unmatched}건 영수증 미매칭 — 수동추가 버튼으로 직접 연결하거나, 파일명에 가맹점명·금액 포함 후 재업로드해보세요.</div>`;
  document.getElementById('warnings').innerHTML=warns;

  const tbody=document.getElementById('result-body');
  tbody.innerHTML='';
  matchedRows.forEach((row,i)=>{
    const eff=(manualOverrides[row.idx]||[]).length?manualOverrides[row.idx]:row.files;
    const hasFile=eff&&eff.length>0;
    const tr=document.createElement('tr');
    tr.innerHTML=`
      <td>${row.idx}${row.merged?' <span class="badge merged">병합</span>':''}</td>
      <td style="white-space:nowrap">${row.date}</td>
      <td>${row.merchant}</td>
      <td style="text-align:right">${row.amtDisplay}</td>
      <td><input type="text" style="border:1px solid #e2e8f0;border-radius:4px;padding:4px 6px;font-size:12px;width:90px;font-family:inherit" value="${row.memo||''}" placeholder="적요" onchange="matchedRows[${i}].memo=this.value"></td>
      <td>${hasFile?`<span class="badge ok">✓ ${eff.length}개</span>`:`<span class="badge no">✗ 없음</span>`}</td>
      <td style="font-size:11px;color:#64748b;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${eff&&eff.length?eff.map(f=>f.name).join(', '):'—'}</td>
      <td><label class="manual-upload-btn">📎 파일 선택<input type="file" accept="image/*,.pdf" multiple class="manual-input" onchange="handleManual(${i},this)"></label></td>
    `;
    tbody.appendChild(tr);
  });
}

function handleManual(rowIdx,input) {
  const files=Array.from(input.files); if (!files.length) return;
  manualOverrides[matchedRows[rowIdx].idx]=files;
  renderTable();
}

// ===== PDF → 이미지 변환 (pdf.js) =====
async function pdfToImages(file) {
  // 각 페이지를 canvas로 렌더링 → base64 PNG
  const arrayBuf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({data: arrayBuf}).promise;
  const images = [];
  for (let p=1; p<=pdf.numPages; p++) {
    const page = await pdf.getPage(p);
    const viewport = page.getViewport({scale: 2.0}); // 2x 해상도
    const canvas = document.createElement('canvas');
    canvas.width = viewport.width;
    canvas.height = viewport.height;
    await page.render({canvasContext: canvas.getContext('2d'), viewport}).promise;
    const b64 = canvas.toDataURL('image/jpeg', 0.92).split(',')[1];
    images.push({b64, ext:'jpeg', mt:'image/jpeg', w:viewport.width, h:viewport.height});
  }
  return images;
}

// ===== DOCX GENERATION =====
async function generateDocx() {
  if (!matchedRows.length) { alert('먼저 엑셀 파일을 업로드해주세요.'); return; }
  const dept=document.getElementById('dept').value||'커리어사업부';
  const cardNo=document.getElementById('card-no').value||'';
  const month=document.getElementById('settle-month').value||'';

  showProgress('영수증 이미지 변환 중...','PDF는 이미지로 변환하고 있어요');

  try {
    const memoInputs=document.querySelectorAll('#result-body input[type="text"]');
    const rows=[];
    for (let i=0;i<matchedRows.length;i++) {
      const row=matchedRows[i];
      const effFiles=(manualOverrides[row.idx]||[]).length?manualOverrides[row.idx]:row.files;
      const imgs=[];
      for (const f of (effFiles||[])) {
        updateProgress(`영수증 변환 중... (${i+1}/${matchedRows.length})`, f.name);
        if (f.name.toLowerCase().endsWith('.pdf')) {
          const pdfImgs = await pdfToImages(f);
          imgs.push(...pdfImgs);
        } else {
          const b64=await fileToB64(f);
          const mt=f.type||'image/jpeg';
          imgs.push({b64, ext:mt.includes('png')?'png':'jpeg', mt});
        }
      }
      rows.push({
        idx:row.idx, date:fmtDate(row.date), merchant:row.merchant,
        amtDisplay:row.amtDisplay, merged:row.merged||false,
        memo:memoInputs[i]?memoInputs[i].value:(row.memo||''),
        dept, cardNo, imgs,
      });
    }

    updateProgress('카드영수증 양식 생성 중...','');
    await buildDocx(rows, dept, cardNo, month);
    hideProgress();
  } catch(err) {
    hideProgress(); console.error(err);
    alert('오류: '+err.message);
  }
}

function fileToB64(file) {
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=e=>res(e.target.result.split(',')[1]);
    r.onerror=rej;
    r.readAsDataURL(file);
  });
}

// ===== DOCX BUILD =====
async function buildDocx(rows, dept, cardNo, month) {
  const zip = new JSZip();
  const imageRels = {};
  let rIdC = 2;

  rows.forEach(row=>{
    row.imgs.forEach(img=>{
      const rId=`rId${rIdC++}`;
      imageRels[rId]={b64:img.b64,ext:img.ext};
      img.rId=rId;
    });
  });

  for (const [rId,rel] of Object.entries(imageRels)) {
    zip.file(`word/media/${rId}.${rel.ext}`,rel.b64,{base64:true});
  }

  const exts=new Set(Object.values(imageRels).map(r=>r.ext));
  const ctD=[
    '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>',
    '<Default Extension="xml" ContentType="application/xml"/>',
  ];
  if (exts.has('jpeg')) ctD.push('<Default Extension="jpeg" ContentType="image/jpeg"/>');
  if (exts.has('png')) ctD.push('<Default Extension="png" ContentType="image/png"/>');

  zip.file('[Content_Types].xml',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
  ${ctD.join('\n  ')}
  <Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>
  <Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/>
  <Override PartName="/word/settings.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.settings+xml"/>
</Types>`);

  zip.file('_rels/.rels',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>
</Relationships>`);

  const relE=[`<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>`];
  for (const [rId,rel] of Object.entries(imageRels)) {
    relE.push(`<Relationship Id="${rId}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/${rId}.${rel.ext}"/>`);
  }
  zip.file('word/_rels/document.xml.rels',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  ${relE.join('\n  ')}
</Relationships>`);

  zip.file('word/settings.xml',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:settings xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:defaultTabStop w:val="720"/></w:settings>`);
  zip.file('word/styles.xml',stylesXml());

  // ===== document.xml =====
  // A4 세로: 11906 x 16838, 여백 720
  const PW=11906, PH=16838, MG=720;
  const CW=PW-MG*2; // 10466

  const F='Malgun Gothic';
  function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&apos;');}

  // 테이블 셀
  function tc(text,w,opts={}) {
    const fill=opts.fill?`<w:shd w:val="clear" w:color="auto" w:fill="${opts.fill}"/>`:'';
    const b=opts.b?'<w:b/><w:bCs/>':'';
    const sz=opts.sz||22;
    const jc=opts.jc?`<w:jc w:val="${opts.jc}"/>`:'';
    const span=opts.span?`<w:gridSpan w:val="${opts.span}"/>`:'';
    const vAlign=`<w:vAlign w:val="${opts.va||'center'}"/>`;
    return `<w:tc>
  <w:tcPr>${span}<w:tcW w:w="${w}" w:type="dxa"/>${fill}${vAlign}
    <w:tcMar><w:top w:w="80" w:type="dxa"/><w:bottom w:w="80" w:type="dxa"/><w:left w:w="120" w:type="dxa"/><w:right w:w="120" w:type="dxa"/></w:tcMar>
  </w:tcPr>
  <w:p><w:pPr>${jc}<w:rPr>${b}<w:sz w:val="${sz}"/><w:szCs w:val="${sz}"/><w:rFonts w:ascii="${F}" w:hAnsi="${F}" w:eastAsia="${F}"/></w:rPr></w:pPr>
  <w:r><w:rPr>${b}<w:sz w:val="${sz}"/><w:szCs w:val="${sz}"/><w:rFonts w:ascii="${F}" w:hAnsi="${F}" w:eastAsia="${F}"/></w:rPr><w:t xml:space="preserve">${esc(text)}</w:t></w:r>
</w:tc>`;
  }

  // 이미지 드로잉
  let drawId=1;
  function imgDrawing(rId,emuW,emuH) {
    const id=drawId++;
    return `<w:drawing>
  <wp:inline distT="0" distB="0" distL="0" distR="0"
    xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing">
    <wp:extent cx="${emuW}" cy="${emuH}"/>
    <wp:effectExtent l="0" t="0" r="0" b="0"/>
    <wp:docPr id="${id}" name="Img${id}"/>
    <wp:cNvGraphicFramePr/>
    <a:graphic xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main">
      <a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture">
        <pic:pic xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture">
          <pic:nvPicPr><pic:cNvPr id="${id}" name="Img${id}"/><pic:cNvPicPr><a:picLocks noChangeAspect="1"/></pic:cNvPicPr></pic:nvPicPr>
          <pic:blipFill>
            <a:blip r:embed="${rId}" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"/>
            <a:stretch><a:fillRect/></a:stretch>
          </pic:blipFill>
          <pic:spPr>
            <a:xfrm><a:off x="0" y="0"/><a:ext cx="${emuW}" cy="${emuH}"/></a:xfrm>
            <a:prstGeom prst="rect"><a:avLst/></a:prstGeom>
          </pic:spPr>
        </pic:pic>
      </a:graphicData>
    </a:graphic>
  </wp:inline>
</w:drawing>`;
  }

  // ===== 양식 테이블 =====
  // 컬럼 설계 (총 CW=10466)
  // 행1: 레이블(1300) 값(1900) 레이블(1300) 값(2366) 레이블(1300) 값(1300) ≈ 9466... 조정
  // 균등 6칸: 레이블 1200, 값 1544.33 → 정수화
  // 실제: L=1200, V=1544 → (1200+1544)*3 = 8232 (너무 작음)
  // CW=10466, 6칸: 레이블3×1200=3600, 값3개 합=6866 → 각 값=2289
  const L=1200, V=Math.floor((CW-L*3)/3); // V=2288
  // 행2,3: 2쌍 → L=1200, V=(CW-L*2)/2 = (10466-2400)/2 = 4033
  const L2=1200, V2=Math.floor((CW-L2*2)/2); // 4033

  // 이미지 행: 전체 병합
  // 이미지 영역 높이: 페이지 남은 공간
  // 메타 테이블 높이 약 2000 DXA (4행×500), 제목 약 700 → 나머지 ≈ PH-MG*2-2700 = 12538
  const IMG_H_DXA = 12000;

  const BRD=`<w:tblBorders>
    <w:top w:val="single" w:sz="8" w:space="0" w:color="000000"/>
    <w:left w:val="single" w:sz="8" w:space="0" w:color="000000"/>
    <w:bottom w:val="single" w:sz="8" w:space="0" w:color="000000"/>
    <w:right w:val="single" w:sz="8" w:space="0" w:color="000000"/>
    <w:insideH w:val="single" w:sz="4" w:space="0" w:color="000000"/>
    <w:insideV w:val="single" w:sz="4" w:space="0" w:color="000000"/>
  </w:tblBorders>`;

  function makeTable(row) {
    // 그리드: 6칸 (행1 기준)
    const g6=`${[L,V,L,V,L,V].map(c=>`<w:gridCol w:w="${c}"/>`).join('')}`;

    // 행1: 연번 | 값 | 부서 | 값 | 카드번호 | 값
    const r1=`<w:tr><w:trPr><w:trHeight w:val="520" w:hRule="atLeast"/></w:trPr>
      ${tc('연  번',L,{fill:'D9E2F3',b:true,sz:20})}
      ${tc(String(row.idx),V,{b:true,sz:22,jc:'center'})}
      ${tc('부  서',L,{fill:'D9E2F3',b:true,sz:20})}
      ${tc(row.dept,V,{sz:22})}
      ${tc('카드번호',L,{fill:'D9E2F3',b:true,sz:20})}
      ${tc(row.cardNo,V,{sz:22,jc:'center'})}
    </w:tr>`;

    // 행2: 영수증 일자 | 값(span3) | 금액 | 값(span1)
    // span 써서 2쌍으로: 레이블(1200)+값(L+V+L+V-1200)... 그냥 gridSpan 활용
    // 행2: L2(1200) V2(4033) L2(1200) V2(4033) — 4칸인데 6칸 그리드에 맞춰야 함
    // gridSpan으로 처리
    const V2a = V+L+V; // 2288+1200+2288=5776 → 3칸 span
    const r2=`<w:tr><w:trPr><w:trHeight w:val="520" w:hRule="atLeast"/></w:trPr>
      ${tc('영수증 일자',L,{fill:'D9E2F3',b:true,sz:20})}
      ${tc(row.date,V2a,{sz:22,span:3})}
      ${tc('금  액',L,{fill:'D9E2F3',b:true,sz:20})}
      ${tc(row.amtDisplay,V,{sz:22,b:true,jc:'right'})}
    </w:tr>`;

    // 행3: 사용처 | 값(span3) | 적요 | 값(span1)
    const r3=`<w:tr><w:trPr><w:trHeight w:val="520" w:hRule="atLeast"/></w:trPr>
      ${tc('사 용 처',L,{fill:'D9E2F3',b:true,sz:20})}
      ${tc(row.merchant,V2a,{sz:22,span:3})}
      ${tc('적  요',L,{fill:'D9E2F3',b:true,sz:20})}
      ${tc(row.memo||'',V,{sz:22})}
    </w:tr>`;

    // 행4 (이미지): 전체 병합 (6칸 span)
    const imgContent = makeImgCell(row.imgs);
    const r4=`<w:tr><w:trPr><w:trHeight w:val="${IMG_H_DXA}" w:hRule="exact"/></w:trPr>
      <w:tc>
        <w:tcPr><w:gridSpan w:val="6"/><w:tcW w:w="${CW}" w:type="dxa"/><w:vAlign w:val="center"/>
          <w:tcMar><w:top w:w="120" w:type="dxa"/><w:bottom w:w="120" w:type="dxa"/><w:left w:w="120" w:type="dxa"/><w:right w:w="120" w:type="dxa"/></w:tcMar>
        </w:tcPr>
        ${imgContent}
      </w:tc>
    </w:tr>`;

    return `<w:tbl>
  <w:tblPr>
    <w:tblW w:w="${CW}" w:type="dxa"/>
    <w:tblLayout w:type="fixed"/>
    ${BRD}
  </w:tblPr>
  <w:tblGrid>${g6}</w:tblGrid>
  ${r1}${r2}${r3}${r4}
</w:tbl>`;
  }

  function makeImgCell(imgs) {
    if (!imgs||!imgs.length) {
      return `<w:p><w:pPr><w:jc w:val="center"/></w:pPr><w:r><w:rPr><w:color w:val="DC2626"/><w:sz w:val="20"/><w:szCs w:val="20"/><w:rFonts w:ascii="${F}" w:hAnsi="${F}" w:eastAsia="${F}"/></w:rPr><w:t>(영수증 이미지 없음)</w:t></w:r></w:p>`;
    }

    if (imgs.length===1) {
      // 세로 꽉 채우기
      const emuW=Math.round((CW-240)*914400/1440);
      const emuH=Math.round((IMG_H_DXA-300)*914400/1440);
      return `<w:p><w:pPr><w:jc w:val="center"/><w:spacing w:before="0" w:after="0"/></w:pPr><w:r><w:rPr/>${imgDrawing(imgs[0].rId,emuW,emuH)}</w:r></w:p>`;
    } else {
      // 이미지 2개: 나란히
      const emuW=Math.round((CW/2-300)*914400/1440);
      const emuH=Math.round((IMG_H_DXA-300)*914400/1440);
      const drawings=imgs.map(img=>`<w:r><w:rPr/>${imgDrawing(img.rId,emuW,emuH)}</w:r>`).join('');
      return `<w:p><w:pPr><w:jc w:val="center"/><w:spacing w:before="0" w:after="0"/></w:pPr>${drawings}</w:p>`;
    }
  }

  // 본문 조립
  let body='';
  rows.forEach((row,i)=>{
    const isLast=(i===rows.length-1);
    // 제목
    body+=`<w:p><w:pPr><w:jc w:val="center"/><w:spacing w:before="0" w:after="240"/><w:rPr><w:b/><w:bCs/><w:sz w:val="36"/><w:szCs w:val="36"/><w:rFonts w:ascii="${F}" w:hAnsi="${F}" w:eastAsia="${F}"/></w:rPr></w:pPr>
<w:r><w:rPr><w:b/><w:bCs/><w:sz w:val="36"/><w:szCs w:val="36"/><w:rFonts w:ascii="${F}" w:hAnsi="${F}" w:eastAsia="${F}"/></w:rPr><w:t>카  드  영  수  증</w:t></w:r></w:p>`;
    // 양식 테이블
    body+=makeTable(row);
    // 페이지 나누기
    if (!isLast) body+=`<w:p><w:pPr><w:pageBreakBefore/><w:spacing w:before="0" w:after="0"/></w:pPr></w:p>`;
  });

  const docXml=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document
  xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"
  xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing"
  xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"
  xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"
  xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">
<w:body>
${body}
<w:sectPr>
  <w:pgSz w:w="${PW}" w:h="${PH}"/>
  <w:pgMar w:top="${MG}" w:right="${MG}" w:bottom="${MG}" w:left="${MG}"/>
</w:sectPr>
</w:body>
</w:document>`;

  zip.file('word/document.xml',docXml);
  updateProgress('파일 압축 중...','');
  const blob=await zip.generateAsync({type:'blob',mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document',compression:'DEFLATE',compressionOptions:{level:6}});
  const fname=`증빙자료_${(month||'').replace('-','년')}월_${dept}_${cardNo}_카드영수증.docx`;
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=fname; document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url),10000);
}

function stylesXml() {
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">
  <w:docDefaults><w:rPrDefault><w:rPr>
    <w:rFonts w:ascii="Malgun Gothic" w:hAnsi="Malgun Gothic" w:eastAsia="Malgun Gothic"/>
    <w:sz w:val="22"/><w:szCs w:val="22"/>
  </w:rPr></w:rPrDefault></w:docDefaults>
  <w:style w:type="table" w:styleId="TableGrid">
    <w:name w:val="Table Grid"/>
    <w:tblPr><w:tblBorders>
      <w:top w:val="single" w:sz="4" w:space="0" w:color="auto"/>
      <w:left w:val="single" w:sz="4" w:space="0" w:color="auto"/>
      <w:bottom w:val="single" w:sz="4" w:space="0" w:color="auto"/>
      <w:right w:val="single" w:sz="4" w:space="0" w:color="auto"/>
      <w:insideH w:val="single" w:sz="4" w:space="0" w:color="auto"/>

    </w:tblBorders></w:tblPr>
  </w:style>
</w:styles>`;
}

function showProgress(msg,sub){
  document.getElementById('progress-msg').textContent=msg;
  document.getElementById('progress-sub').textContent=sub||'';
  document.getElementById('progress-overlay').classList.add('show');
}
function updateProgress(msg,sub){
  document.getElementById('progress-msg').textContent=msg;
  document.getElementById('progress-sub').textContent=sub||'';
}
function hideProgress(){document.getElementById('progress-overlay').classList.remove('show');}

// INIT

document.getElementById('settle-month').value=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
